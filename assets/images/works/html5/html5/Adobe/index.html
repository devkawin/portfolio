<html>
    <head>
        <meta http-equiv="X-UA-TextLayoutMetrics" content="gdi"/>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <title>300x600</title>
        <meta name="ad.size" content="width=300,height=600">
        <link type="text/css" rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="mainContainer">
            <div id="modelContainer" class="full abs">
                <img id="model" class="full abs" src="images/model.jpg"/>
            </div>
            <img id="mobile" class="full abs hidden" src="images/mobile.jpg"/>
            <div id="mobileCopyContainer" class="mobileCopyContainer">
                <div id="blueBg" class="blueBg"></div>
                <div id="mobileCopyInnerContainer" class="mobileCopyInnerContainer">
                    <img id="mobileCopy1" class="abs" src="images/mobileCopy1.png"/>
                    <img id="mobileCopy2" class="abs" src="images/mobileCopy2.png"/>
                </div>
            </div>
            <img id="f1Copy1" src="images/f1Copy1.png" class="full abs frame1Copy">
            <img id="f1Copy2" src="images/f1Copy2.png" class="full abs frame1Copy">
            <img id="f1Copy3" src="images/f1Copy3.png" class="full abs frame1Copy">
            <img id="f2Copy1" src="images/f2Copy1.png" class="hidden full abs frame2Copy">
            <img id="f2Copy2" src="images/f2Copy2.png" class="hidden full abs frame2Copy">
            <img id="f3Copy1" src="images/f2Copy1.png" class="hidden full abs frame3Copy">
            <img id="f3Copy2" src="images/f3Copy2.png" class="hidden full abs frame3Copy">
            <img id="f4Copy1" src="images/f2Copy1.png" class="hidden full abs frame4Copy">
            <img id="f4Copy2" src="images/f4Copy2.png" class="hidden full abs frame4Copy">
            <img id="message1" src="images/message1.png" class="hidden full abs message">
            <img id="message2" src="images/message2.png" class="hidden full abs message">
            <img id="message3" src="images/message3.png" class="hidden full abs message">
            <div id="message4Container" class="message4Container hidden">
                <div id="message4CopyContainer" class="message4CopyContainer">
                    <img id="message4Copy1" class="abs" src="images/message4Copy1.png"/>
                    <img id="message4Copy2" class="abs" src="images/message4Copy2.png"/>
                </div>
                <div id="leftTopCircle" class="leftTop circle"></div>
                <div id="leftBottomCircle" class="leftBottom circle"></div>
                <div id="rightTopCircle" class="rightTop circle"></div>
                <div id="rightBottomCircle" class="rightBottom circle"></div>
            </div>
            <img id="cta" class="frame1Copy full abs" src="images/cta.png"/>
            <img id="logo" class="full abs" src="images/logo.png"/>
            <div id="border" class="full abs"></div>
        </div>
        <script src="https://cdn.flashtalking.com/frameworks/js/gsap/3.9.1/gsap.min.js"></script>
        <script src="https://cdn.flashtalking.com/frameworks/js/api/2/10/html5API.js"></script>
        <script src="script.js"></script>
        <script type="text/javascript">
            var myFT = new FT;
            container = FT.query("#mainContainer");
            myFT.applyClickTag(container, 1);
        </script>
    </body>
</html>
