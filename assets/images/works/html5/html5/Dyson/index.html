<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="ad.size" content="width=300,height=600">
    <script>
        var clickTag = "https://www.dyson.com";
    </script>

    <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.9.1_min.js"></script>

    <title>300x600</title>
    <script src="custom.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div id="outer_wrapper" onclick="window.open(window.clickTag, '_blank');  void(0); ">

        <div id="outer_wrapper">
            <div id="inner_wrapper" class="absolute fades">

                <div id="bg_container" class="absolute mask">
                    <img id="bg02" class="retina" src="images/bg02.jpg" />
                    <img id="bg01" class="retina" src="images/bg01.jpg" />
                </div>

                <div id="white_bg" class="absolute"></div>

                <img id="bg03" class="retina fades" src="images/bg03.jpg" />

                <img id="bg02_copy" class="retina fades" src="images/bg02_copy.png">

                <div id="steam_container" class="absolute">
                    <img id="steam01" class="retina fades" src="images/steam.png">
                    <img id="steam02" class="retina fades" src="images/steam.png">
                </div>

                <img id="fr1_vector" class="retina" src="images/fr1_vector.png">

                <div id="copyContainer">
                    <div id="copy01" class="copy">
                        Choosing an</br>air purifier?
                        <span>Check it has</br>automatic sensing</span>
                    </div>
                    <div id="copy02" class="copy fades">
                        that detects and</br>tracks household</br>pollutants
                    </div>
                    <div id="copy03" class="copy fades">to filter them</br>from your air.</div>
                    <div id="copy04" class="copy fades">Senses pollutants</br>automatically
                    <span>Discover what</br>else to look for</span>
                    </div>
                </div>

                <div id="black_line_container" class="absolute mask">
                    <svg id="black_line" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 422.32 4425.74">
                        <defs>
                            <style>
                                .black_line {
                                    fill: none;
                                    stroke: #000;
                                    stroke-miterlimit: 10;
                                    stroke-width: 5px;
                                }

                                .black_circle {
                                    stroke-width: 0px;
                                }
                            </style>
                        </defs>
                        <polyline id="black_line_svg" class="black_line fades" points="0 84.29 24.83 84.29 44.48 30.24 92.17 7.09" />
                        <circle id="black_circle_svg" class="black_circle fades" cx="95.36" cy="5.68" r="5.68" />
                    </svg>
                </div>

                <div id="line_container" class="absolute mask">
                    <svg id="line_svg" class="absolute" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 377.81 189.48">
                        <defs>
                            <linearGradient id="Gradient1" gradientTransform="rotate(90)">
                                <stop class="stop1" offset="19%" />
                                <stop class="stop2" offset="19%" />
                                <stop class="stop2" offset="55%" />
                                <stop class="stop4" offset="55%" />
                            </linearGradient>
                            <style>
                                .cls-1 {
                                    fill: none;
                                    stroke: url(#Gradient1);
                                    stroke-linecap: round;
                                    stroke-linejoin: round;
                                    stroke-width: 9px;
                                }

                                .cls-2 {
                                    fill: #4285f4;
                                    stroke-width: 0px;
                                }

                                .stop1 {
                                    stop-color: #ff6600;
                                }

                                .stop2 {
                                    stop-color: #fffb00;
                                }

                                .stop3 {
                                    stop-color: #00ff00;
                                }

                                .stop4 {
                                    stop-color: #00ff00;
                                }
                            </style>
                            <!-- <filter id="glow2" x="0.529602" y="0.5" width="956.97" height="270.365" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                                <feGaussianBlur stdDeviation="10" />
                                <feComponentTransfer>
                                    <feFuncA type="linear" slope="0.5" />
                                </feComponentTransfer>
                                <feBlend mode="normal" in2="SourceGraphic" />
                            </filter> -->
                        </defs>
                        <polyline id="line" class="cls-1" points="5.5 102.56 41.84 5.5 191.59 5.55 191.59 5.52 204.64 40.85 226.37 99.67 251.84 168.71 252.47 168.7 443.53 168.74" />
                        <ellipse id="circle" class="cls-2" cx="364.53" cy="168.74" rx="10.85" ry="10.46" />
                    </svg>
                </div>

                <img id="logo02" class="retina" src="images/logo02.png">

                <div id="footer" class="retina">
                    <img src="images/footer.png" class="retina" alt="" />
                    <div id="rtbText" class="absolute">Buy direct from Dyson.com</div>
                </div>

                <img id="color_line" class="retina" src="images/color_line.png">

                <div id="cta_container" class="absolute fades">
                    <div id="cta_copy" class="retina fades">Learn more</div>
                    <img id="cta_circle" class="retina" src="images/cta_circle.png">
                    <div id="cta_arrow_container" class="absolute mask">
                        <img id="cta_arrow" class="retina" src="images/cta_arrow.png">
                    </div>
                </div>

                <img id="ef_icon01" class="retina fades icons" src="images/ef_icon1.png">
                <img id="ef_icon02" class="retina fades icons" src="images/ef_icon2.png">
                <img id="ef_icon03" class="retina fades icons" src="images/ef_icon3.png">

                <div id="black_bg"></div>

                <img id="logo" class="retina" src="images/logo.png">

                <!-- <img id="guide" class="retina" style="opacity: 0.5;" src="images/guide.png"> -->

            </div>
            <!-- inner_wrapper ends -->
            <div id="border" class="absolute"></div>
        </div>
        <!-- outer_wrapper ends -->
</body>

</html>
